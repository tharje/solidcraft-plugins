name: Update plugin list

on:
  schedule:
    # twice a day, so one run GitHub skips does not matter (UTC: 05:43 and 17:43 in Norway in winter)
    - cron: "43 4,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect plugins and build the pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update.py
      - name: Commit if changed
        run: |
          # the date alone changes every day: commit only when a plugin changed
          git add -A data plugins icons index.html sitemap.xml
          if git diff --cached --quiet -I '"generated": "20'; then
            echo "No plugin changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update plugin list"
          git push
